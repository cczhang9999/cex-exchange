version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: cex-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: cex_exchange
      MYSQL_USER: cex_user
      MYSQL_PASSWORD: cex_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./cex-exchange/db_schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    networks:
      - cex-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 后端Go服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cex-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=cex_exchange
    volumes:
      - ./cex-exchange/config.docker.yaml:/app/config.yaml:ro
    ports:
      - "8080:8080"
    networks:
      - cex-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/klines"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端Vue应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cex-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - cex-network
    user: root
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis缓存（可选，用于会话存储）
  redis:
    image: redis:7-alpine
    container_name: cex-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - cex-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  cex-network:
    driver: bridge 